name: MH Wilds early PAK diagnostics

on:
  push:
    branches: [mhw-early-pak-01433]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep source checkouts on LF line endings
        run: git config --global core.autocrlf false

      - name: Check out reviewed patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: patch-input
          persist-credentials: false

      - name: Check out official Nightly 01433 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: praydog/REFramework
          ref: d4611aef1d63effd3a736bdf9404ea702428017d
          path: upstream
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Apply early integrity initialization fix
        run: |
          python patch-input/scripts/apply_wilds_early_integrity.py --source upstream --diff applied-early-integrity.patch

      - name: Upload applied source diff
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: applied-early-integrity-diff
          path: applied-early-integrity.patch
          if-no-files-found: ignore

      - name: Install PAK hooks before DLL staging
        run: python patch-input/scripts/apply_wilds_pak_early.py --source upstream --diff applied-pak-early.patch

      - name: Upload PAK source diff
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: applied-pak-early-diff
          path: applied-pak-early.patch
          if-no-files-found: ignore

      - name: Audit direct struct field access
        working-directory: upstream
        run: |
          pip install libclang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/audit_direct_access_clang.py

      - name: Configure CMake
        run: >-
          cmake -S upstream -B build -G "Visual Studio 18 2026" -A x64
          "-DCMAKE_BUILD_TYPE=Release"
          "-DDEVELOPER_MODE=ON"
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build patched DLL
        run: cmake --build build --config Release --target REFramework

      - name: Package patched DLL
        run: |
          @"
          Upstream: d4611aef1d63effd3a736bdf9404ea702428017d (Nightly 01433)
          Patch input commit: $env:GITHUB_SHA
          Fix: install Wilds integrity markers and PAK hooks before DLL copying
          Diagnostics: log early archive hook installation; retain stock DXGI initialization
          Install only dinput8.dll with the game closed; preserve existing scripts and settings.
          "@ | Set-Content -Encoding utf8 build-info.txt
          Compress-Archive -Path build/bin/REFramework/dinput8.dll,build-info.txt -DestinationPath REFramework-01433-early-pak-diagnostics.zip

      - name: Upload patched build
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: REFramework-01433-early-pak-diagnostics
          path: REFramework-01433-early-pak-diagnostics.zip
          if-no-files-found: error
